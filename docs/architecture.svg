<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="k8s-multi-cloud-monitor 구성도: 사용자는 NCP Object Storage에 올린 Next.js 정적 페이지를 받고, API는 Ingress와 ALB를 거쳐 NKS의 NestJS 백엔드로 들어갑니다. 백엔드는 1분마다 등록된 각 클러스터의 Kubernetes API에서 노드와 파드 정보를 읽어 Cloud DB for PostgreSQL에 저장합니다. 여러 파드 중 advisory lock을 잡은 하나만 수집하고, 클러스터 토큰은 암호화해서 저장합니다.">
