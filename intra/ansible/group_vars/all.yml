# intra/ansible/group_vars/all.yml
---
# Common variables for all hosts
ansible_python_interpreter: /usr/bin/python3
ansible_user: ansible

# AWS Region
aws_region: ap-northeast-2

# DNS Configuration
dns_zone: k8s.internal

# Common packages
common_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - unzip