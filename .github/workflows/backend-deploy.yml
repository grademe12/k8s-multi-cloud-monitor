name: Backend CI/CD

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  REGISTRY: multi-cloud.kr.ncr.ntruss.com
  IMAGE_NAME: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Configure NCP credentials
      run: |
        mkdir -p $HOME/.ncloud
        cat > $HOME/.ncloud/configure << EOF
        [DEFAULT]
        ncloud_access_key_id = ${{ secrets.NCR_ACCESS_KEY }}
        ncloud_secret_access_key = ${{ secrets.NCR_SECRET_KEY }}
        ncloud_api_url = https://ncloud.apigw.ntruss.com
        EOF
    
    - name: Install ncp-iam-authenticator
      run: |
        curl -o ncp-iam-authenticator -L https://github.com/NaverCloudPlatform/ncp-iam-authenticator/releases/latest/download/ncp-iam-authenticator_linux_amd64
        chmod +x ./ncp-iam-authenticator
        mkdir -p $HOME/bin
        mv ./ncp-iam-authenticator $HOME/bin/ncp-iam-authenticator
        # GitHub Actions에서는 GITHUB_PATH 사용
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Login to Naver Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.NCR_ACCESS_KEY }}
        password: ${{ secrets.NCR_SECRET_KEY }}

    - name: Extract version
      id: version
      run: |
        echo "VERSION=v$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        # PATH 다시 확인
        export PATH=$PATH:/usr/local/bin
        kubectl version --client

    - name: Update Deployment YAML with new image
      run: |
        sed -i "s|image:.*backend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}|g" backend/backend-deployment.yaml

    - name: Create Kubernetes Secret
      run: |
        kubectl delete secret backend-env --ignore-not-found
        kubectl create secret generic backend-env \
          --from-literal=DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
          --from-literal=DATABASE_PORT=${{ secrets.DATABASE_PORT }} \
          --from-literal=DATABASE_USER=${{ secrets.DATABASE_USER }} \
          --from-literal=DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
          --from-literal=DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
          --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
          --from-literal=ENCRYPTION_SECRET_KEY=${{ secrets.ENCRYPTION_SECRET_KEY }}

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f backend/backend-deployment.yaml
        kubectl apply -f backend/backend-service.yaml
        kubectl apply -f backend/backend-ingress.yaml

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/backend --timeout=5m

    - name: Cleanup
      if: always()
      run: rm -f $HOME/.kube/config